name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

  deploy-hugging-face:
    name: Deploy to Hugging Face
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_DEPLOY_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}

    steps:
      - name: Check out repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check deployment credential
        id: credential
        shell: bash
        run: |
          if [ -n "$HF_DEPLOY_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "HF_DEPLOY_TOKEN is not configured; deployment will be skipped safely."
          fi

      - name: Push GitHub main to Hugging Face Space
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git remote add space "https://FlyingNunchucks:${HF_DEPLOY_TOKEN}@huggingface.co/spaces/FlyingNunchucks/10-peer-to-peer-coordination-agent"
          git push --force space main

      - name: Deployment not configured
        if: steps.credential.outputs.available != 'true'
        run: echo "Tests passed, but Hugging Face deployment was skipped because HF_DEPLOY_TOKEN is not configured."
